spring.application.name=suivi-livraison
# Configuration de la base de donn\u00e9es MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/suivi_livraison?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Port du serveur
server.port=8080
